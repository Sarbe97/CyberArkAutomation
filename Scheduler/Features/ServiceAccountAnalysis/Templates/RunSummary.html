<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ServiceAccountAnalysis – Run Summary</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style type="text/css">
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        body { margin: 0 !important; padding: 0 !important; background-color: #f2f2f2; width: 100%; }
        h1, h2, p, td, th, li, div { font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; }
    </style>
</head>
<body>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f2f2f2;">
    <tr>
        <td align="center" style="padding:20px 12px;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
                   style="width:600px; max-width:600px; background-color:#ffffff; border:1px solid #d8d8d8;">

                <!-- ── HEADER ── -->
                <tr>
                    <td style="padding:20px 24px 14px 24px; border-bottom:1px solid #e0e0e0;">
                        <p style="margin:0; font-size:16px; font-weight:bold; color:#222222;">
                            Service Account Analysis &ndash; {{ModeTitle}}
                        </p>
                        <p style="margin:4px 0 0 0; font-size:12px; color:#888888;">
                            Generated: {{GeneratedDate}}
                        </p>
                    </td>
                </tr>

                <!-- ── METRIC CARDS ── -->
                <tr>
                    <td style="padding:24px 20px 16px 20px; background-color:#fafafa; border-bottom:1px solid #e8e8e8;">

                        <!-- Row 1 -->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                            <tr>
                                <!-- Total Service Accounts -->
                                <td width="100%" valign="top" style="padding:0 6px 10px 0;">
                                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                                           style="background:#ffffff; border:1px solid #e0e0e0; border-top:3px solid #3498db;">
                                        <tr>
                                            <td style="padding:16px 18px 14px 18px; text-align: center;">
                                                <p style="margin:0; font-size:32px; font-weight:bold; color:#3498db; line-height:1;">{{TotalServiceAccounts}}</p>
                                                <p style="margin:6px 0 0 0; font-size:11px; color:#666666; text-transform:uppercase; letter-spacing:0.5px;">Total Service Accounts Found</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- ── Attached Reports ── -->
                <tr>
                    <td style="padding:20px 24px 24px 24px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                            <tr>
                                <td style="background-color:#f7f9fb; border:1px solid #dce8f0; border-left:3px solid #3498db; padding:12px 16px;">
                                    <p style="margin:0 0 8px 0; font-size:12px; font-weight:bold; color:#333333;">Attached Reports</p>
                                    <p style="margin:2px 0; font-size:12px; color:#555555;">&#8250; AnalysisReport.csv</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- ── FOOTER ── -->
                <tr>
                    <td style="padding:12px 24px; border-top:1px solid #e0e0e0;">
                        <p style="margin:0; font-size:11px; color:#999999; text-align:center;">
                            Automated report from CyberArk Scheduler &nbsp;&middot;&nbsp; Do not reply to this email.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
